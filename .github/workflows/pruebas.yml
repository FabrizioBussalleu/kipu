name: Pruebas del compilador Kipu

on:
  push:
  pull_request:

jobs:
  pruebas:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependencias
        run: python -m pip install -r requirements.txt
      - name: Verificar lineamientos de la gramática
        run: python scripts/verificar_gramatica.py
      - name: Pruebas (léxico, sintáctico, semántico y LLVM)
        run: python -m unittest discover -s tests -v
      - name: Derivaciones más a la izquierda
        run: python scripts/derivaciones.py
